<svg xmlns="http://www.w3.org/2000/svg" width="980" height="480" viewBox="0 0 980 480" role="img" aria-labelledby="title desc">
  <title id="title">U-Net coefficients times a trunk basis</title>
  <desc id="desc">A U-Net encodes a vorticity field into coefficient maps. A trunk MLP reads coordinates and is the path that automatic differentiation follows for the Navier-Stokes residual. Gradients still reach the U-Net through the coefficients.</desc>
  <style>
    .bg { fill: #16161e; }
    .card { fill: #1e2030; stroke: #3b4261; }
    .h { fill: #c0caf5; font: 600 18px ui-sans-serif, system-ui, sans-serif; }
    .s { fill: #9aa5ce; font: 13px ui-sans-serif, system-ui, sans-serif; }
    .box { fill: #24283b; stroke: #7aa2f7; }
    .box2 { fill: #24283b; stroke: #bb9af7; }
    .box3 { fill: #24283b; stroke: #9ece6a; }
    .box4 { fill: #24283b; stroke: #e0af68; }
    .t { fill: #c0caf5; font: 14px ui-sans-serif, system-ui, sans-serif; }
    .m { fill: #9aa5ce; font: 12px ui-sans-serif, system-ui, sans-serif; }
  </style>
  <rect class="bg" width="980" height="480" rx="12"/>
  <text class="h" x="36" y="46">Where the derivative is allowed to live</text>
  <text class="s" x="36" y="70">The PDE asks for d/dt, grad, and Laplacian. Those inputs belong to the trunk.</text>
  <rect class="box" x="36" y="110" width="200" height="78" rx="8"/>
  <text class="t" x="136" y="142" text-anchor="middle">vorticity field</text>
  <text class="m" x="136" y="164" text-anchor="middle">grid, no coordinates</text>
  <rect class="box" x="300" y="110" width="200" height="78" rx="8"/>
  <text class="t" x="400" y="142" text-anchor="middle">U-Net</text>
  <text class="m" x="400" y="164" text-anchor="middle">coefficient maps B_k</text>
  <rect class="box2" x="36" y="250" width="200" height="78" rx="8"/>
  <text class="t" x="136" y="282" text-anchor="middle">(x, y, t)</text>
  <text class="m" x="136" y="304" text-anchor="middle">query, requires grad</text>
  <rect class="box2" x="300" y="250" width="200" height="78" rx="8"/>
  <text class="t" x="400" y="282" text-anchor="middle">trunk MLP</text>
  <text class="m" x="400" y="304" text-anchor="middle">basis phi_k(x, y, t)</text>
  <rect class="box3" x="580" y="180" width="180" height="78" rx="8"/>
  <text class="t" x="670" y="212" text-anchor="middle">inner product</text>
  <text class="m" x="670" y="234" text-anchor="middle">omega = sum B_k phi_k</text>
  <rect class="box4" x="800" y="180" width="150" height="78" rx="8"/>
  <text class="t" x="875" y="212" text-anchor="middle">NS residual</text>
  <text class="m" x="875" y="234" text-anchor="middle">through the trunk</text>
  <path d="M236 149 H300" stroke="#7aa2f7" fill="none" stroke-width="1.6"/>
  <path d="M500 149 H560 V200 H580" stroke="#7aa2f7" fill="none" stroke-width="1.6"/>
  <path d="M236 289 H300" stroke="#bb9af7" fill="none" stroke-width="1.6"/>
  <path d="M500 289 H560 V230 H580" stroke="#bb9af7" fill="none" stroke-width="1.6"/>
  <path d="M760 219 H800" stroke="#e0af68" fill="none" stroke-width="1.6"/>
  <path d="M875 258 C875 360 400 400 400 328" stroke="#e0af68" fill="none" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text class="s" x="430" y="392">Dashed: reverse mode for d(omega)/dt and the spatial derivatives. It walks the trunk.</text>
  <text class="s" x="36" y="430">The U-Net still trains. Its gradient arrives through B_k, not through a pixel Laplacian.</text>
  <text class="s" x="36" y="452">Stop-gradient on the sample location, or the sampler invents its own d/dx.</text>
</svg>
